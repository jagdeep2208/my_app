<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Member Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;

            padding: 35px;
            border-radius: 14px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        h1 {
            font-size: 30px;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .login-container input {
            width: 100%;
            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ccc;
            border-radius: 8px;

            font-size: 16px;
        }

        .login-container input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;

            background: #2563eb;
            color: white;

            border: none;
            padding: 14px;

            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            background: #fee2e2;
            color: #b91c1c;

            padding: 12px;
            border-radius: 8px;

            margin-bottom: 20px;
        }

        @media (max-width: 600px) {

            .login-container {
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>

</head>

<body>

    <div class="login-container">

        <h1>Member Management</h1>

        <p class="subtitle">
            Login to continue
        </p>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>

</html>
